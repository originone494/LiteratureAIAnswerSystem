<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>文献管理系统</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#cbc9e9",
                        "secondary-fixed": "#e2e2e9",
                        "on-secondary-fixed": "#3d3f45",
                        "inverse-surface": "#0e0e0f",
                        "secondary-fixed-dim": "#d3d4db",
                        "on-primary": "#f6f7ff",
                        "tertiary-container": "#d9d7f8",
                        "surface-container-low": "#f6f3f4",
                        "primary-fixed": "#dde2f2",
                        "surface-dim": "#dbd9dd",
                        "on-error": "#fff7f6",
                        "surface-container": "#f0edef",
                        "outline": "#7b7a7d",
                        "primary": "#585e6b",
                        "on-error-container": "#752121",
                        "on-tertiary-fixed": "#383751",
                        "on-background": "#323235",
                        "on-primary-container": "#4c525f",
                        "primary-container": "#dde2f2",
                        "error-dim": "#4e0309",
                        "on-primary-fixed": "#393f4c",
                        "on-tertiary-container": "#4a4a65",
                        "primary-dim": "#4c535f",
                        "error": "#9f403d",
                        "outline-variant": "#b3b1b4",
                        "inverse-primary": "#e5ebfb",
                        "surface-container-high": "#eae7ea",
                        "surface-tint": "#585e6b",
                        "surface": "#fcf8f9",
                        "on-primary-fixed-variant": "#555c69",
                        "on-surface": "#323235",
                        "tertiary": "#5d5c78",
                        "secondary-container": "#e2e2e9",
                        "on-surface-variant": "#5f5f61",
                        "primary-fixed-dim": "#cfd4e4",
                        "surface-container-highest": "#e4e2e5",
                        "error-container": "#fe8983",
                        "on-secondary": "#f8f8ff",
                        "surface-bright": "#fcf8f9",
                        "on-secondary-fixed-variant": "#5a5b61",
                        "surface-variant": "#e4e2e5",
                        "on-tertiary": "#fbf7ff",
                        "background": "#fcf8f9",
                        "on-secondary-container": "#505257",
                        "tertiary-dim": "#51516c",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#54546f",
                        "inverse-on-surface": "#9e9c9d",
                        "tertiary-fixed": "#d9d7f8",
                        "secondary": "#5d5f65",
                        "secondary-dim": "#515359"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .editorial-shadow { box-shadow: 0 12px 40px rgba(50, 50, 53, 0.06); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .paper-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .paper-card:hover {
            transform: translateX(4px);
        }
        .paper-card.selected {
            background: linear-gradient(90deg, #dde2f2 0%, #ffffff 100%);
            border-left: 4px solid #585e6b;
        }
        .delete-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .paper-card:hover .delete-btn {
            opacity: 1;
        }
        .upload-area {
            border: 2px dashed #7b7a7d;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #585e6b;
            background: #f6f3f4;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <!-- Top Navigation -->
    <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl flex justify-between items-center px-8 py-3 border-b border-slate-100">
        <div class="flex items-center gap-8">
            <span class="text-xl font-black text-slate-800 tracking-tighter font-headline">文献管理系统</span>
            <nav class="hidden md:flex gap-6 items-center">

            </nav>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input id="searchInput" class="pl-10 pr-4 py-2 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 w-64 text-sm font-body" placeholder="搜索文献..." type="text"/>
            </div>
            <button class="md:hidden w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-lg" onclick="toggleMobileSidebar()">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="h-screen w-64 fixed left-0 top-0 bg-slate-50 border-r border-transparent z-40 hidden md:block">
        <div class="flex flex-col h-full p-4 pt-20">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
                    <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-800 leading-none font-headline">知识库</h2>
                    <p class="text-[10px] uppercase tracking-widest text-slate-500 font-medium mt-1">文献管理</p>
                </div>
            </div>
            
            <nav class="space-y-1 flex-grow">
                
            </nav>
            
            <!-- Upload Button -->
            <button id="uploadBtn" class="mt-6 mb-6 w-full py-3 bg-primary text-on-primary font-bold rounded-xl shadow-md hover:opacity-90 transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">upload_file</span>
                上传文献
            </button>
            <input type="file" id="fileInput" accept=".pdf,.txt,.md,.doc,.docx" multiple class="hidden">
            
            <!-- Stats -->
            <div class="pt-6 border-t border-slate-200">
                <div class="bg-white rounded-xl p-4 border border-outline-variant/20 mb-4">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm text-on-surface-variant">文献总数</span>
                        <span id="totalPapers" class="text-2xl font-bold text-primary">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-on-surface-variant">文本块总数</span>
                        <span id="totalChunks" class="text-2xl font-bold text-tertiary">0</span>
                    </div>
                </div>
                
                <!-- Go to Chat Button -->
                <button onclick="window.location.href='/'" class="w-full py-3 bg-secondary-container text-on-secondary-container rounded-xl text-sm font-semibold flex items-center justify-center gap-2 hover:bg-secondary-fixed transition-all">
                    <span class="material-symbols-outlined text-sm">chat</span>
                    前往交流界面
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-0 md:ml-64 pt-16 h-screen flex flex-col md:flex-row overflow-hidden bg-surface">
        <!-- Document List -->
        <section class="flex-1 flex flex-col h-full overflow-hidden border-r border-transparent bg-surface">
            <!-- Header -->
            <div class="px-8 pt-8 pb-6 bg-surface">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h1 class="text-3xl font-black font-headline text-on-surface tracking-tight">文献库</h1>
                        <p id="paperCount" class="text-on-surface-variant font-body text-sm mt-1">0 篇文献</p>
                    </div>
                </div>
                <!-- Upload Area for Mobile -->
                <div class="md:hidden mb-4">
                    <div id="uploadAreaMobile" class="upload-area bg-white rounded-xl p-4 text-center cursor-pointer">
                        <span class="material-symbols-outlined text-primary">upload_file</span>
                        <span class="ml-2 text-sm font-medium text-on-surface">上传文献</span>
                    </div>
                </div>
            </div>
            
            <!-- Documents List -->
            <div class="flex-1 overflow-y-auto px-8 space-y-4 pb-10" id="papersList">
                <!-- Papers will be rendered here -->
            </div>
        </section>

        <!-- Preview Panel -->
        <section class="hidden lg:flex w-full md:w-[450px] bg-surface-container-low h-full flex-col overflow-y-auto no-scrollbar border-l border-outline-variant/10">
            <!-- Empty State -->
            <div id="emptyState" class="flex-1 flex items-center justify-center">
                <div class="text-center p-8">
                    <div class="w-24 h-24 bg-secondary-container rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="material-symbols-outlined text-secondary" style="font-size: 48px;">menu_book</span>
                    </div>
                    <h3 class="text-xl font-bold text-on-surface mb-2 font-headline">选择一篇文献</h3>
                    <p class="text-on-surface-variant">点击左侧文献查看详情</p>
                </div>
            </div>
            
            <!-- Detail Content -->
            <div id="detailContent" class="hidden flex-col">
                <!-- Preview Content -->
            </div>
        </section>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl fade-in">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary">upload_file</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-on-surface font-headline">上传文献</h3>
                        <p class="text-sm text-on-surface-variant">支持 PDF, TXT, MD, DOCX</p>
                    </div>
                </div>
                
                <div id="uploadArea" class="upload-area bg-surface-container-low rounded-xl p-8 text-center cursor-pointer mb-4">
                    <div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-outlined text-primary" style="font-size: 32px;">drive_folder_upload</span>
                    </div>
                    <p class="font-semibold text-on-surface mb-1">点击或拖拽文件到此处</p>
                    <p class="text-sm text-on-surface-variant">PDF, TXT, MD, DOCX</p>
                </div>
                
                <div id="uploadStatus" class="text-sm text-on-surface-variant text-center mb-4"></div>
                
                <div class="flex gap-3">
                    <button onclick="closeUploadModal()" class="flex-1 py-3 bg-surface-container text-on-surface-variant rounded-xl font-semibold hover:bg-surface-container-high transition-colors">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl fade-in">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-error-container rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-error" style="font-size: 36px;">delete</span>
                </div>
                <h3 class="text-xl font-bold text-on-surface mb-2 font-headline">确认删除</h3>
                <p id="deletePaperTitle" class="text-on-surface-variant mb-6"></p>
                <div class="flex gap-3 justify-center">
                    <button onclick="closeDeleteModal()" class="px-6 py-2.5 bg-surface-container text-on-surface-variant rounded-xl font-semibold hover:bg-surface-container-high transition-colors">
                        取消
                    </button>
                    <button id="confirmDelete" class="px-6 py-2.5 bg-error text-on-error rounded-xl font-semibold hover:opacity-90 transition-colors">
                        删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global Variables
        let papersData = {};
        let selectedPaper = null;
        let paperToDelete = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await loadPapers();
            setupUpload();
            setupSearch();
        });

        // Load Papers
        async function loadPapers() {
            try {
                const response = await fetch('/api/papers');
                const data = await response.json();
                if (data.success) {
                    papersData = data.papers;
                    renderPapersList();
                    updateStats();
                }
            } catch (error) {
                console.error('加载文献失败:', error);
            }
        }

        // Render Papers List
        function renderPapersList() {
            const container = document.getElementById('papersList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const paperArray = Object.entries(papersData).map(([name, info]) => ({ name, ...info }));
            
            let filteredPapers = paperArray;
            if (searchTerm) {
                filteredPapers = paperArray.filter(paper => {
                    const meta = paper.metadata || {};
                    const title = (meta.title || paper.name).toLowerCase();
                    const authors = (meta.authors || []).join(' ').toLowerCase();
                    return title.includes(searchTerm) || authors.includes(searchTerm);
                });
            }
            
            document.getElementById('paperCount').textContent = `${filteredPapers.length} 篇文献`;
            
            if (filteredPapers.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <div class="w-20 h-20 bg-secondary-container rounded-full flex items-center justify-center mx-auto mb-4">
                            <span class="material-symbols-outlined text-secondary" style="font-size: 40px;">library_books</span>
                        </div>
                        <h4 class="font-bold text-on-surface mb-2 font-headline">暂无文献</h4>
                        <p class="text-on-surface-variant text-sm">上传您的第一篇文献开始使用吧</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredPapers.map(paper => {
                const meta = paper.metadata || {};
                const title = meta.title || paper.name;
                const authors = meta.authors || [];
                const year = meta.year || '';
                const chunkCount = paper.total_chunks || paper.chunk_count || 0;
                const isSelected = selectedPaper === paper.name;
                
                return `
                    <div class="paper-card p-5 rounded-xl ${isSelected ? 'bg-surface-container-highest editorial-shadow border-l-4 border-primary' : 'bg-surface-container-low hover:bg-surface-container-high'} transition-all group cursor-pointer"
                         data-paper="${paper.name}"
                         onclick="selectPaper('${paper.name}')">
                        <div class="flex gap-5 items-start">
                            <div class="w-12 h-16 bg-white rounded-md shadow-sm flex-shrink-0 flex flex-col items-center justify-center border border-outline-variant/10">
                                <span class="text-[10px] font-black text-red-600 mb-1">PDF</span>
                                <span class="material-symbols-outlined text-slate-400">article</span>
                            </div>
                            <div class="flex-grow">
                                <div class="flex justify-between items-start">
                                    <h3 class="text-base font-bold text-on-surface leading-tight font-headline group-hover:text-primary transition-colors line-clamp-2">${title}</h3>
                                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2">
                                        <button class="delete-btn p-1.5 hover:bg-white rounded-lg text-outline transition-colors" onclick="event.stopPropagation(); showDeleteModal('${paper.name}')">
                                            <span class="material-symbols-outlined text-lg">delete</span>
                                        </button>
                                    </div>
                                </div>
                                <p class="text-sm text-on-surface-variant mt-1 font-medium line-clamp-1">
                                    ${authors.length > 0 ? authors.slice(0, 3).join(', ') + (authors.length > 3 ? ' 等' : '') : '未知作者'}
                                    ${year ? ` • ${year}` : ''}
                                </p>
                                <div class="flex gap-2 mt-3">
                                    <span class="px-2 py-0.5 bg-primary-container text-on-primary-container rounded text-[10px] font-bold uppercase tracking-wider">
                                        ${chunkCount} 文本块
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Select Paper
        function selectPaper(paperName) {
            selectedPaper = paperName;
            renderPapersList();
            showDetail(paperName);
        }

        // Show Detail
        function showDetail(paperName) {
            const paper = papersData[paperName];
            if (!paper) return;
            
            const meta = paper.metadata || {};
            const title = meta.title || paperName;
            const authors = meta.authors || [];
            const journal = meta.journal || '';
            const year = meta.year || '';
            const abstract = meta.abstract || '';
            const chunks = paper.chunks || [];
            
            document.getElementById('emptyState').classList.add('hidden');
            const detailContent = document.getElementById('detailContent');
            detailContent.classList.remove('hidden');
            detailContent.classList.add('flex');
            
            detailContent.innerHTML = `
                <div class="h-48 bg-slate-200 relative overflow-hidden flex items-center justify-center">
                    <div class="relative z-10 w-20 h-28 bg-white rounded-lg shadow-xl flex flex-col items-center justify-center border border-white/20 backdrop-blur-md">
                        <span class="text-xs font-black text-red-600 mb-2">PDF</span>
                        <span class="material-symbols-outlined text-3xl text-slate-300">article</span>
                    </div>
                </div>
                <div class="p-8">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">description</span>
                        <span class="text-xs font-bold tracking-widest text-primary uppercase">文献详情</span>
                    </div>
                    <h2 class="text-2xl font-black font-headline text-on-surface leading-tight mb-4">${title}</h2>
                    <div class="space-y-6">
                        ${authors.length > 0 ? `
                            <div>
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-2">作者</h4>
                                <p class="text-sm text-on-surface leading-relaxed font-body">${authors.join(', ')}</p>
                            </div>
                        ` : ''}
                        ${abstract ? `
                            <div>
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-2">摘要</h4>
                                <p class="text-sm text-on-surface leading-relaxed font-body">${abstract}</p>
                            </div>
                        ` : ''}
                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-outline-variant/20">
                            ${journal ? `
                                <div>
                                    <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-1">期刊</h4>
                                    <p class="text-xs font-bold text-on-surface">${journal}</p>
                                </div>
                            ` : ''}
                            ${year ? `
                                <div>
                                    <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-1">年份</h4>
                                    <p class="text-xs font-bold text-on-surface">${year}</p>
                                </div>
                            ` : ''}
                            <div>
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-1">文本块</h4>
                                <p class="text-xs font-bold text-primary">${chunks.length} 块</p>
                            </div>
                            ${meta.doi ? `
                                <div>
                                    <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-1">DOI</h4>
                                    <p class="text-xs font-bold text-primary">${meta.doi}</p>
                                </div>
                            ` : ''}
                        </div>
                        ${chunks.length > 0 ? `
                            <div class="pt-8">
                                <h4 class="text-[10px] font-black uppercase tracking-widest text-on-surface-variant mb-4">文本块预览</h4>
                                <div class="space-y-3 max-h-64 overflow-y-auto">
                                    ${chunks.slice(0, 5).map((chunk, idx) => `
                                        <div class="bg-white p-4 rounded-lg border border-outline-variant/10">
                                            <p class="text-xs text-on-surface-variant mb-2 font-bold">文本块 #${idx + 1}</p>
                                            <p class="text-sm text-on-surface line-clamp-3">${typeof chunk === 'string' ? chunk : (chunk.content || '')}</p>
                                        </div>
                                    `).join('')}
                                    ${chunks.length > 5 ? `<p class="text-center text-on-surface-variant text-sm py-2">还有 ${chunks.length - 5} 个文本块...</p>` : ''}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Update Stats
        function updateStats() {
            const paperCount = Object.keys(papersData).length;
            let chunkCount = 0;
            Object.values(papersData).forEach(paper => {
                chunkCount += paper.total_chunks || paper.chunk_count || (paper.chunks || []).length;
            });
            
            document.getElementById('totalPapers').textContent = paperCount;
            document.getElementById('totalChunks').textContent = chunkCount;
        }

        // Setup Upload
        function setupUpload() {
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const uploadAreaMobile = document.getElementById('uploadAreaMobile');
            
            uploadBtn.addEventListener('click', () => {
                document.getElementById('uploadModal').classList.remove('hidden');
                document.getElementById('uploadModal').classList.add('flex');
            });
            
            uploadAreaMobile.addEventListener('click', () => {
                document.getElementById('uploadModal').classList.remove('hidden');
                document.getElementById('uploadModal').classList.add('flex');
            });
            
            uploadArea.addEventListener('click', () => fileInput.click());
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        }

        // Handle Files
        async function handleFiles(files) {
            const statusEl = document.getElementById('uploadStatus');
            
            for (const file of files) {
                statusEl.textContent = `正在上传: ${file.name}...`;
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        statusEl.textContent = `✓ ${file.name} 上传成功`;
                        await loadPapers();
                        setTimeout(closeUploadModal, 1500);
                    } else {
                        statusEl.textContent = `✗ 上传失败: ${data.error || '未知错误'}`;
                    }
                } catch (error) {
                    statusEl.textContent = `✗ 上传失败: ${error.message}`;
                }
            }
        }

        // Close Upload Modal
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadStatus').textContent = '';
        }

        // Show Delete Modal
        function showDeleteModal(paperName) {
            paperToDelete = paperName;
            const paper = papersData[paperName];
            const title = (paper.metadata || {}).title || paperName;
            document.getElementById('deletePaperTitle').textContent = `确定要删除《${title}》吗？`;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }

        // Close Delete Modal
        function closeDeleteModal() {
            paperToDelete = null;
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
        }

        // Confirm Delete
        document.getElementById('confirmDelete').addEventListener('click', async function() {
            if (!paperToDelete) return;
            
            try {
                const response = await fetch(`/api/papers/${encodeURIComponent(paperToDelete)}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                if (data.success) {
                    if (selectedPaper === paperToDelete) {
                        selectedPaper = null;
                        document.getElementById('emptyState').classList.remove('hidden');
                        document.getElementById('detailContent').classList.add('hidden');
                        document.getElementById('detailContent').classList.remove('flex');
                    }
                    await loadPapers();
                    closeDeleteModal();
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('删除失败: ' + error.message);
            }
        });

        // Setup Search
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', renderPapersList);
        }

        // Close modals on outside click
        document.getElementById('uploadModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('uploadModal')) closeUploadModal();
        });
        
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
        });

        // Toggle Mobile Sidebar
        function toggleMobileSidebar() {
            alert('移动端侧边栏功能');
        }
    </script>
</body>
</html>
